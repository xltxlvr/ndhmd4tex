# postit 패키지 활용
# :::{postit opt="",raw=""} => \begin{PostItNote}[opt]raw
# :::{tikzpicture opt=""} => \begin{tikzpicture}[opt]
environments:
  postit:
    begin: |-
      \begin{PostItNote}
      ?[%(opt)s]
      ?%(raw)s
    end: '\end{PostItNote}'
  tikzpicture:
    lines: raw
    begin: |-
      \begin{tikzpicture}
      ?[%(opt)s]
    end: '\end{tikzpicture}'

# {|color|text|} => \MiniPostIt[color]{text}
# {||color|text||} => \MiniPostIt*[color]{text}
extra_inline:
  - name: minipostitshade
    pattern: '\{\|\|(.+?)\|\|(.+?)\}'
    template: '\MiniPostIt*[%s]{%s}'
  - name: minipostit
    pattern: '\{\|(.+?)\|(.+?)\}'
    template: '\MiniPostIt[%s]{%s}'
