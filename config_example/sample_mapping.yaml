# ndhmd4tex.py 샘플 mapping.yaml  (스크립트 0.6.3 기준)
#
# ── 이 파일의 성격 ─────────────────────────────────────────────────
# 스크립트가 참조하는 **모든 설정 키**를 빠짐없이, 각각의 **기본값 그대로**
# 적어둔 레퍼런스다. 따라서 이 파일을 그대로 --config로 넘겨도 아무것도
# 달라지지 않는다(유일한 예외는 hr 하나 — 7번 항목 참고). 바꾸고 싶은
# 키만 남기고 나머지는 통째로 지우는 식으로 쓰면 된다.
#
# 각 항목마다 기본값은 활성 상태로, 추천 대안은 주석으로 달아두었다.
#
# ── 병합 규칙 (중요) ───────────────────────────────────────────────
# DEFAULT_CONFIG에 대해 deep_merge된다.
#   * 딕셔너리형 키 (headings, environments, refcite, showexam)
#     → **항목 단위 병합**. 일부만 적어도 나머지 기본값은 살아남는다.
#   * 리스트형 키 (inline, escape_chars, literal_macros,
#                  raw_inline_formats, extra_macros)
#     → **전체 교체**. 하나만 적으면 나머지 기본 항목은 전부 사라진다.
#       특히 inline을 손댈 때 조심할 것 — bold만 적으면 italic, strike,
#       bold_italic, emphdot이 모두 죽는다.
#   * extra_macros만은 예외적으로 "literal_macros 위에 덧붙이는" 별도
#     리스트라, 기본 조사 매크로를 유지한 채 토큰을 추가할 때 쓴다.
#
# ── 적용 방법 ──────────────────────────────────────────────────────
#   front matter에  mapping: mapping.yaml
#   또는 CLI에서    --config mapping.yaml      (--config가 우선)


# ── 1. 헤딩 레벨 매핑 ──────────────────────────────────────────────
# 마크다운 # 부터 ###### 까지 여섯 단계를 어떤 LaTeX 구역 명령에
# 대응시킬지 정한다.
#
# 주의: front matter의 `toplevel:`을 쓰면 이 설정이 **덮어써진다.**
# toplevel은 설정 로딩이 끝난 뒤 headings를 통째로 다시 계산하기 때문이다.
# 계층은 part > chapter > section > subsection > subsubsection >
# paragraph > subparagraph 순이고, 지정한 것부터 6단계를 자동으로 채운다.
# 둘을 함께 쓰지 말 것 — toplevel이 이긴다.
headings:
  1: chapter
  2: section
  3: subsection
  4: subsubsection
  5: paragraph
  6: subparagraph

# article 클래스용 예시 (\chapter가 없으므로):
# headings:
#   1: section
#   2: subsection
#   3: subsubsection
#   4: paragraph
#   5: subparagraph
#   6: subparagraph


# ── 2. 인라인 서식 규칙 ────────────────────────────────────────────
# 위에서부터 순서대로 적용된다. 별 세 개(***)를 두 개(**)보다 먼저 두는
# 것처럼, 긴 델리미터가 앞에 와야 한다.
#
# template의 %s 자리에 매치된 내용이 들어간다. 내용은 escape_text를 거친
# 뒤 꽂히므로 그 안의 특수문자는 알아서 안전해진다.
#
# 리스트형 키라 **전체 교체**다. 아래 다섯 개가 기본값 전부이니, 하나를
# 바꾸려면 나머지도 함께 적어야 한다.
#
# \sout은 ulem 패키지가 필요하고, \dotemph는 프로젝트에서 직접 정의해야
# 한다 (예: \newcommand{\dotemph}[1]{...} — 전통 한국어 편집물의 방점).
inline:
  - name: bold_italic
    pattern: '\*\*\*(.+?)\*\*\*'
    template: '\textbf{\emph{%s}}'
  - name: bold
    pattern: '\*\*(.+?)\*\*'
    template: '\textbf{%s}'
  - name: italic
    pattern: '\*(.+?)\*'
    template: '\emph{%s}'
  - name: strike
    pattern: '~~(.+?)~~'
    template: '\sout{%s}'
  - name: emphdot
    pattern: '\^\^(.+?)\^\^'
    template: '\dotemph{%s}'

# 규칙을 **더하기만** 할 거라면 위 다섯을 베껴 올 필요 없이 아래
# extra_inline 을 쓴다.


# ── 2.5. 인라인 규칙 추가 (기본 목록 앞에 끼워 넣음) ──────────────
# inline 은 리스트형이라 손대면 전체가 교체된다. 규칙 하나 더하자고 기본
# 다섯 개를 통째로 베껴 오는 것은 번거롭고, 기본값이 바뀌면 뒤처진다.
# extra_inline 은 기본 목록을 그대로 둔 채 **앞에** 끼워 넣는다.
#
# 뒤가 아니라 앞인 이유: 규칙은 위에서부터 차례로 적용되므로 긴 델리미터가
# 먼저 와야 한다. ***...*** 규칙을 뒤에 붙이면 앞선 **...** 가 먼저 먹어
# 버려 아무 일도 일어나지 않는다.
#
# 주의: 기본 규칙보다 짧거나 겹치는 델리미터를 앞에 두면 기본 규칙을
# 가려버린다(*...* 를 앞에 두면 **굵게** 가 깨진다). 새 델리미터를 더할
# 때만 쓰고, 기존 것을 바꿀 때는 inline 자체를 override 할 것.
#
# 캡처 그룹은 개수만큼 그대로 template 에 꽂힌다. 그래서 인자를 둘 이상
# 받는 규칙도 만들 수 있다. 그룹 수와 %s 수가 어긋나면 경고를 찍고 원문을
# 그대로 둔다.
extra_inline: []

# 예시:
# extra_inline:
#   - name: dialog             # *[화자][지시]  ->  \Dialog{화자}{지시}
#     pattern: '\*\[(.+?)\]\[(.+?)\]'
#     template: '\Dialog{%s}{%s}'
#   - name: dialog_short       # *[화자]  (긴 것을 먼저 둘 것)
#     pattern: '\*\[(.+?)\]'
#     template: '\Dialog{%s}'
#   - name: highlight          # ==하이라이트==  (soul 패키지)
#     pattern: '==(.+?)=='
#     template: '\hl{%s}'
#   - name: underline          # ++밑줄++  (ulem 패키지)
#     pattern: '\+\+(.+?)\+\+'
#     template: '\uline{%s}'
#   - name: smallcaps          # ,,작은대문자,,
#     pattern: ',,(.+?),,'
#     template: '\textsc{%s}'


# ── 3. 커스텀 환경 (:::{name} ... :::) ────────────────────────────
# default는 등록되지 않은 이름에 쓰이는 폴백이다. %(raw)s에는 :::{...}의
# raw= 속성값이 그대로 꽂힌다(이름 없는 positional 인자용 탈출구).
# 딕셔너리형 키라 항목 단위 병합 — 아래 셋 중 일부만 적어도 된다.
environments:
  default:
    begin: '\begin{%(name)s}%(raw)s'
    end: '\end{%(name)s}'
  quote:
    begin: '\begin{quote}'
    end: '\end{quote}'
  center:
    begin: '\begin{center}'
    end: '\end{center}'

  # 떠다니는 상자. :::{table place=... caption=... label=... align=...}
  #
  # %(key|기본값)s 는 그 속성이 **주어지지 않았을 때** 쓸 값이고, 줄 앞의
  # ? 는 "이 줄이 참조하는 속성이 비면 줄을 통째로 버린다"는 뜻이다(17.4).
  # 덕분에 caption이나 label을 생략하면 그 줄만 빠진다. align="" 처럼
  # 빈 값을 명시하면 기본 \centering도 끌 수 있다.
  #
  # 캡션 위치가 다르다 — 표는 내용 위, 그림은 내용 아래가 관례라
  # figure는 caption/label을 end 쪽에 둔다.
  table:
    begin: |-
      \begin{table}[%(place|htbp)s]
      ?%(align|\centering)s
      ?\caption{%(caption)s}
      ?\label{%(label)s}
    end: '\end{table}'
  figure:
    begin: |-
      \begin{figure}[%(place|htbp)s]
      ?%(align|\centering)s
    end: |-
      ?\caption{%(caption)s}
      ?\label{%(label)s}
      \end{figure}

  # 운문. lines: keep 이면 블록 파서를 태우지 않고 원문의 행 구조를 그대로
  # 넘긴다. 보통 문단은 여러 줄을 이어붙이는 것이 옳지만 시는 행이 곧
  # 의미라서 이어붙이면 원문이 망가지기 때문이다. 빈 줄은 연 구분으로
  # 그대로 남고, 앞뒤의 빈 줄은 떼어낸다. 인라인 서식과 매크로는 정상 동작.
  #
  # line_end 는 행 끝에 붙일 것. hverse(oblivoir-misc)는 필요 없고 표준
  # verse 는 \\ 를 요구한다. 연의 마지막 행에는 붙이지 않는다.
  hverse:
    begin: '\begin{hverse}'
    end: '\end{hverse}'
    lines: keep
  verse:
    begin: '\begin{verse}'
    end: '\end{verse}'
    lines: keep
    line_end: ' \\'

  # 완전히 raw. lines: raw 이면 인라인 처리 자체를 건너뛰고 원문을 글자
  # 그대로(들여쓰기·개행 포함) 붙인다 — 매크로도, 수식도, 각주도, 색인도,
  # **강조**나 [링크](url) 같은 마크다운 문법도 전혀 해석되지 않는다.
  #
  # TikZ가 대표적인 이유다. \draw[...] (A)to[out=-90,in=90](B); 같은 코드에서
  # [out=-90,in=90](B) 부분이 마크다운 링크 문법과 우연히 같은 모양이라
  # \href{B}{out=-90,in=90} 로 오인되어 버린다. 그림 코드 안에 %, _, $, **
  # 처럼 마크다운이 손대는 문자가 얼마든지 나올 수 있으므로, "이 환경 안은
  # 절대 건드리지 마라"고 선언하는 것이 유일하게 안전한 방법이다.
  #
  # 예시(tikz 패키지는 사용자가 preamble에 직접 불러와야 한다):
  # tikzpicture:
  #   begin: '\begin{tikzpicture}[%(raw)s]'
  #   end: '\end{tikzpicture}'
  #   lines: raw

  # \begin{thebibliography}{...} 의 인자는 "가장 넓은 라벨"이다. 항목이
  # 아홉 개 이하면 "9", 백 개 미만이면 "99" 식으로 자릿수를 맞춘다.
  # 내용에는 \bibitem 을 직접 쓴다 — 그 뒤 본문에는 *이탤릭* 같은 마크다운
  # 인라인 서식이 그대로 먹는다.
  thebibliography:
    begin: '\begin{thebibliography}{%(widest|99)s}'
    end: '\end{thebibliography}'

  # ── 추가 예시 ──
  # 이름 있는(named) 대괄호 인자: :::{theorem title="피타고라스"}
  # -> \begin{theorem}[피타고라스]   (amsthm의 \newtheorem 정의 필요)
  # theorem:
  #   begin: '\begin{theorem}[%(title)s]'
  #   end: '\end{theorem}'
  #
  # 커스텀 박스 (tcolorbox 패키지 필요)
  # warning:
  #   begin: '\begin{tcolorbox}[colback=red!5,title=주의]'
  #   end: '\end{tcolorbox}'
  #
  # raw= 속성만 쓰는 환경은 여기 등록할 필요가 없다. default 템플릿이
  # 알아서 처리한다:
  #   :::{adjustwidth raw={1cm}{1cm}}  ->  \begin{adjustwidth}{1cm}{1cm}


# ── 4. 상호참조 / 인용 프리픽스  ([프리픽스라벨]) ─────────────────
# 키는 대괄호 안 라벨 **앞에 붙는 프리픽스**, 값은 %s에 라벨이 들어가는
# 템플릿. 딕셔너리형이라 바꾸고 싶은 항목만 적어도 된다.
#
# \titleref는 \nameref와 달리 표준이 아니라 프로젝트에서 직접 정의해야
# 하고, \Cref는 cleveref 패키지가 필요하다. [C:sec:a,sec:b]처럼 콤마로
# 여러 라벨을 넘기는 것은 cleveref가 알아서 처리한다.
#
# \crefrange{a}{b}처럼 인자가 둘로 갈리는 범위 참조는 이 문법으로
# 지원하지 않는다 — 본문에 직접 써도 raw 매크로 규칙으로 통과한다.
#
# E: 는 amsmath의 \eqref 다. 프리픽스가 라벨에서 잘려나가므로 "eq:" 로 두면
# 관례대로 이름 붙인 \label{eq:c} 를 [eq:c] 로 가리킬 때 \eqref{c} 가 되어
# 버린다. 그래서 C:/F:/T: 와 같은 꼴인 E: 로 두었다.
#
# F: / T: 는 memoir의 \fref / \tref 를 흉내낸 것이다. [F:fig:a] 가
# \figurename~\ref{fig:a} 로 나가므로 참조할 때마다 "그림", "표"를 손으로
# 적지 않아도 된다. \figurename / \tablename 은 어느 클래스나 정의하고
# kotex·babel이 언어에 맞게 바꿔주므로 한국어 문서에서 특히 편하다.
#
# @t: / @p: / @a: / @y: 는 natbib·biblatex 계열 명령이다. 프리픽스는 쓰일
# 때만 발동하므로 그 패키지를 안 쓰는 문서에는 아무 부담이 없다. 페이지
# 지정처럼 인자가 붙는 형태는 축약형으로 감당하지 않는다 — 본문에
# \citep[p.~33]{key} 나 \citep[see][p.~33]{key} 라고 직접 쓰면 매크로
# 규칙으로 그대로 통과한다.
refcite:
  "#": '\ref{%s}'
  "page:": '\pageref{%s}'
  "@": '\cite{%s}'
  "@t:": '\citet{%s}'
  "@p:": '\citep{%s}'
  "@a:": '\citeauthor{%s}'
  "@y:": '\citeyear{%s}'
  "E:": '\eqref{%s}'
  "F:": '\figurename~\ref{%s}'
  "T:": '\tablename~\ref{%s}'
  "title:": '\titleref{%s}'
  "name:": '\nameref{%s}'
  "C:": '\Cref{%s}'

  # ── 추가/변경 예시 ──
  # 프로젝트 전용 매크로로 갈아끼우기:
  # "name:": '\hbref{%s}'
  #
  # 새 프리픽스 추가:
  # "vref:": '\vref{%s}'        # varioref
  # "S:": '\sectionname~\ref{%s}'   # F:/T: 와 같은 발상 (클래스가 정의할 때)
  # "L:": '\lstlistingname~\ref{%s}'


# ── 5. 인라인 raw 스팬이 인정하는 포맷 이름 ───────────────────────
# `...`{=latex} 문법(7.1)에서 "그대로 통과"로 볼 포맷들. 여기 없는 포맷을
# 겨냥한 스팬은 Pandoc과 마찬가지로 통째로 버려진다(예: `<br>`{=html}).
# 리스트형이라 전체 교체 — 추가하려면 기본 셋을 함께 적을 것.
raw_inline_formats: ["latex", "tex", "raw"]

# ConTeXt 출력도 같이 관리하는 문서라면:
# raw_inline_formats: ["latex", "tex", "raw", "context"]


# ── 5.1. 인용구(> ...)가 쓸 환경 ──────────────────────────────────
# 인용 범위 안에 (처음과 끝을 뺀) 빈 줄이 하나라도 있으면, 즉 인용이 두 문단
# 이상이면 blockquote_multi_env 를 쓴다. LaTeX의 관례가 그렇다 — quote 는
# 문단 들여쓰기가 없어 짧은 한 문단 인용에, quotation 은 각 문단의 첫 줄을
# 들여쓰므로 여러 문단짜리 긴 인용에 맞는다.
#
# 인용구 안의 빈 줄은 > 만 있는 줄로 적는다. 진짜 빈 줄은 블록 자체를 끊어
# 인용구 두 개가 되어버린다.
#
# 둘을 같은 값으로 두면 이 구분이 사라진다.
blockquote_env: quote
blockquote_multi_env: quotation


# ── 5.2. 설명 리스트 표기 ─────────────────────────────────────────
#   both   : {용어} ::  설명  과  용어 :: 설명  둘 다 인정 (기본값)
#   braces : 중괄호형만 인정. 맨 표기를 만나면 경고를 찍고 평범한 문단으로
#            둔다 — 조용히 사라지지 않으므로 옮겨 적을 자리를 찾을 수 있다.
#
# 중괄호형은 줄 첫머리에 {..} 를, :: 뒤에 공백/탭 두 개 이상을 요구한다.
# 산문이 우연히 그 꼴이 될 일이 없어 오인식이 사실상 없고, 용어에 공백이나
# 콜론을 넣을 수도 있다({C++의 std::vector} ::  동적 배열).
description_syntax: both


# ── 5.2.5. front matter의 모르는 키를 넘길 매크로 접두사 ─────────
# theme: dark 라고 적으면 \def\NMtheme{dark} 가 프리앰블 앞에 놓인다.
# 알파벳만으로 된 키, 스칼라 값만 넘어간다. 빈 문자열이면 기능이 꺼진다.
# 키는 소문자로 낮춰서 매크로 이름을 만든다(Theme: -> \NMtheme).
#
# multimarkdown은 접두사 없이 \def\theme{dark} 로 넘기는데, 원고에 흔한
# 낱말이 그대로 제어열 이름이 되어 클래스·패키지 명령을 덮어쓸 수 있다.
metadata_macro_prefix: NM


# ── 5.23. 그림 관련 명령 이름 ─────────────────────────────────────
# {inline} 이 쓸 명령 (inlinegraphicx 패키지) 과
# {caption="..."} 이 쓸 명령 (capt-of 또는 caption 패키지).
# 둘 다 패키지 로딩은 저자 몫이다.
inline_graphics_cmd: inlinegraphics
captionof_cmd: captionof


# ── 5.24. 애니메이션 fps ──────────────────────────────────────────
# --animation 으로 GIF를 프레임으로 쪼갤 때 \animategraphics 에 넘길 값.
# GIF는 프레임마다 지연이 다를 수 있지만 이 명령은 단일 fps만 받으므로
# 원본 타이밍을 그대로 살릴 수 없다.
animation_fps: 10


# ── 5.25. 그림 wrap 배치가 쓸 환경 ───────────────────────────────
# ![](x.png){wrap, wrapspec="...", ...} 이 감쌀 환경 이름.
# 본문이 그림을 둘러싸게 하는 것으로 wrapstuff 패키지가 제공한다
# (패키지 로딩은 저자 몫). wrapspec= 값은 환경의 대괄호 인자로 그대로
# 넘어가므로, 환경이 무엇을 받든 저자가 정한다.
wrap_env: wrapstuff


# ── 5.3. 줄임표 (...) ─────────────────────────────────────────────
# 마침표 세 개를 이 문자열로 바꾼다. 마침표를 나란히 찍으면 간격이 붙어버려
# 조판상 틀린 결과가 나오기 때문이다(multimarkdown과 같은 처리).
#
# 끝의 {} 는 필수다. 한글 음절이 letter 인 조판 환경에서 \ldots이렇게 라고
# 나가면 TeX이 그 전체를 하나의 제어열 이름으로 읽어 Undefined control
# sequence 가 난다.
#
# 한국어 조판에서 줄임표는 폰트에 따라 모양과 간격이 제각각이라 갈아끼울
# 수 있게 해두었다. 흔히 쓰는 대안:
#   ellipsis: '\dots{}'          amsmath. 앞뒤 문맥에 따라 간격 조절
#   ellipsis: '\textellipsis{}'  텍스트용 줄임표
#   ellipsis: '……'                유니코드 줄임표 두 개(한국어 전통 6점)
#   ellipsis: ''                 변환하지 않고 마침표 세 개 그대로
ellipsis: '\ldots{}'

# ── 물결표(\~) ─────────────────────────────────────────────────────
# default 면 ~ 와 \~ 를 둘 다 원문 그대로 LaTeX에 맡긴다(옛 동작). 다른
# 값을 주면 ~ 는 그대로 묶음빈칸이고 \~ 만 이 값으로 바뀐다.
#   wavedash: FF5E                유니코드 코드포인트(16진, 따옴표 권장)
#   wavedash: "U+301C"            U+ 접두도 가능
#   wavedash: "〜"                한 글자 그대로
#   wavedash: \koreanWaveDash     LaTeX 매크로(뒤에 {}가 자동으로 붙음)
wavedash: default

# ── ~ 와 ^ 의 방언 ─────────────────────────────────────────────────
# latex(기본)     ~ 는 묶음빈칸으로 그대로 나가고, ^ 는 \textasciicircum{}.
# pandoc          ~ 는 \textasciitilde{}. ~x~ 는 \textsubscript{x}, ^x^ 는
#                 \textsuperscript{x} (안에 공백 없는 닫힌 꼴만).
# multimarkdown   (mmd 도 가능) 위의 닫힌 꼴에 더해, a~b 는 a\textsubscript{b},
#                 a^b 는 a\textsuperscript{b} (뒤따르는 글자·숫자 덩어리까지).
#                 뒤에 글자가 없는 ~ 는 \ensuremath{\sim}.
# \~ 는 어느 모드에서나 wavedash 규칙을 따른다. --pandoc(진짜 pandoc)에서는 무시.
tilde: latex


# ── 5.4. 인라인 각주 허용 여부 ────────────────────────────────────
# [^...] 안의 내용이 수집된 각주 정의의 식별자가 아니면, 그 내용을 각주
# 본문으로 그대로 읽는다([^각주 텍스트] -> \footnote{각주 텍스트}).
# 정의 식별자는 [A-Za-z0-9_-]+ 로 제한되므로 한글이나 공백이 섞인 내용은
# 참조일 수가 없어, 두 용법이 헷갈리지 않는다.
#
# false로 두면 예전처럼 정의되지 않은 참조에 경고를 찍고 원문을 그대로
# 남긴다. 참조 식별자 오타가 조용히 각주로 둔갑하는 게 싫다면 그 편이
# 안전하다. 참조와 헷갈릴 여지가 없는 ^[각주 본문] 표기(Pandoc과 동일)는
# 이 설정과 무관하게 언제나 동작한다.
inline_footnote: true


# ── 5.5. 라인 코멘트 ───────────────────────────────────────────────
# 행 머리(들여쓰기 없이 정확히 첫 칸)에 // 로 시작하는 줄을 통째로
# 지운다 — LaTeX 사용자가 익숙해 하는 "라인 코멘트"다. 기본은 꺼져
# 있다. % 는 이스케이프 대상이자 흔한 문장부호(백분율)라 쓸 수 없고,
# # 는 헤딩·상호참조에 이미 쓰이며, -- 는 en dash 관례(예: "1--6")로
# 이미 뜻이 있어서 그대로 두면 충돌한다. //를 골랐지만 그래도 기본은
# 꺼두는 이유는 코드 예제에 C/JS 류 // 주석이 들여쓰기 없이 첫 칸부터
# 나올 수 있기 때문이다 — 다만 코드 펜스(```...```) 안은 이 검사보다
# 먼저 보호되므로, 펜스 **안의** // 는 이 옵션을 켜도 절대 지워지지
# 않는다. 위험한 것은 오직 원고 본문에 우연히 첫 칸부터 //로 시작하는
# 줄이 있는 경우뿐이다.
#
#   // 이 줄은 지워진다.
#     // 들여쓰기가 있으면 지워지지 않는다(엄격히 첫 칸만 인정).
#
# 뒤따르는 개행까지 함께 지운다. 그래서 리스트 항목 사이에 빈 줄 없이
# 끼워 넣어도 리스트가 쪼개지지 않는다 — 이 기능을 만든 주된 이유다.
linecomment: false

# ── 파이프 표의 긴 셀 자동 줄바꿈 ────────────────────────────────
# 파이프 표의 추정 폭(반 em 단위: 한글·CJK 한 글자=2, 그 밖=1)이 이 값을
# 넘으면 폭이 큰 열(대략 한글 8자 이상)만 l/c/r 대신 X[l]/X[c]/X[r]로
# 바꾼다. 70 ≈ 한글 35자. 이 값 이하인 표는 전혀 바뀌지 않는다. 0 또는
# false 면 끈다. (X 열이 있으면 표가 줄 폭 전체로 늘어난다는 점에 주의.)
tablewrap: 70


# ── 5.5. 색인 명령 ([[표시|색인어]]) ──────────────────────────────
# %(text)s 에 표시 텍스트가, %(term)s 에 색인어가 들어간다.
#
# TeX의 \index 는 인자를 특수하게 읽는 탓에 사용자가 재정의하기가 몹시
# 까다롭다. 그래서 명령 이름을 박아두는 대신 템플릿을 통째로 갈아끼울 수
# 있게 했다. 직접 정의한 매크로로 바꾸려면:
#   index_template: '%(text)s\myidx{%(term)s}'
# 인자를 둘 받는 매크로라면 표시 텍스트의 위치까지 템플릿이 정한다:
#   index_template: '\myidx{%(text)s}{%(term)s}'
#
# 두 값 모두 이스케이프나 인라인 서식 처리를 거치지 않고 raw로 꽂힌다.
# makeindex가 인자 안에서 !(계층), @(정렬키), |(서식)을 특수하게 쓰므로
# 건드리면 그 문법을 못 쓰게 되기 때문이다.
index_template: '%(text)s\index{%(term)s}'


# ── 6. 코드 블록 렌더링 ────────────────────────────────────────────
# codeblock_template: 언어 태그가 붙은 펜스에 쓰인다.
#   %(lang)s = 언어 태그, %(body)s = 코드 본문.
# verbatim_env: 언어 태그가 없는 펜스에 쓰이는 환경 이름.
#
# 기본값은 minted다 — 컴파일 시 -shell-escape가 필요하고 느리다.
codeblock_template: "\\begin{minted}{%(lang)s}\n%(body)s\n\\end{minted}"
verbatim_env: verbatim

# listings로 갈아타기 (-shell-escape 불필요, 훨씬 빠름):
# codeblock_template: "\\begin{lstlisting}[language=%(lang)s]\n%(body)s\n\\end{lstlisting}"
#
# 아예 색칠을 포기하고 verbatim으로:
# codeblock_template: "\\begin{verbatim}\n%(body)s\n\\end{verbatim}"


# ── 7. 가로줄과 대시 (독립 줄 --- 또는 ***, 문장 중 ---) ────────────
# 이 세 키는 DEFAULT_CONFIG에 없고 코드에 폴백으로 박혀 있다. 즉 아래
# 줄들을 지워도 값이 사라지는 게 아니라 똑같은 폴백이 쓰인다. 그래서 이
# 파일이 DEFAULT_CONFIG와 글자 그대로 일치하지 않는 유일한 지점이지만,
# 값이 폴백과 같으므로 결과는 동일하다.

# 독립된 줄에 --- 세 개 이상만 있으면(가로줄) 이 명령이 나간다.
hr: '\noindent\rule{\linewidth}{0.5pt}'
# 더 가벼운 대안:
# hr: '\hrulefill'

# 독립된 줄에 *** 세 개 이상만 있으면(asterism, 장면 전환 표시) 이 명령이
# 나간다. 기본값은 단순한 여백이다.
asterism: '\bigskip'
# 별 세 개를 실제로 조판하고 싶다면(memoir의 \fancybreak 등, preamble에
# 정의 필요):
# asterism: '\fancybreak{* * *}'

# 문장 "중간"에 등장하는 --- (정확히 3개, 앞뒤에 다른 대시 없음)는 이
# 명령으로 바뀐다. 기본값은 표준 LaTeX 명령이라 preamble에 아무것도
# 정의하지 않아도 그대로 컴파일된다.
mdash: '\textemdash{}'
# 자체 매크로를 쓰고 싶다면(예: 자간을 살짝 준 버전을 preamble에 정의):
# mdash: '\ndhmdash{}'
# hr: '\par\vspace{1em}\centerline{* * *}\vspace{1em}\par'


# ── 8. 자동 이스케이프 대상 문자 ───────────────────────────────────
# 평문에 그냥 쓴(어떤 보호 문법에도 안 걸린) 이 문자들을 안전한 LaTeX
# 표현으로 바꾼다. 리스트형이라 전체 교체다.
#
# ~ 가 빠져 있는 것은 의도다(7.2). 원고의 ~ 와 \~ 는 둘 다 손대지 않고
# 그대로 LaTeX 소스로 나가며, 묶음빈칸인지 물결표인지는 LaTeX 쪽(문서
# 클래스나 조사/물결표 처리 패키지)이 정한다.
escape_chars: ["\\", "&", "%", "#", "_", "$", "{", "}", "^"]

# 맨 ~ 도 \textasciitilde{}로 바꾸던 예전 동작으로 되돌리려면:
# escape_chars: ["\\", "&", "%", "#", "_", "$", "{", "}", "~", "^"]
#   (\~ 는 이 설정과 무관하게 언제나 그대로 나간다)
#
# 인라인 코드 스팬 안에서는 이 목록과 상관없이 ~ 가 항상
# \textasciitilde{}로 이스케이프된다 — 코드를 글자 그대로 보여주는
# 자리이기 때문이다.


# ── 9. 리터럴 매크로 토큰 ─────────────────────────────────────────
# \[a-zA-Z]+ 이름 패턴에 안 걸리는 고정 토큰들. 한국어 조사 매크로가
# 여기 있는 이유는, 문자 클래스를 한글까지 열면 "\는맛있다"처럼 붙여 쓰는
# 관례 때문에 뒤 단어까지 매크로 이름으로 먹혀버리기 때문이다.
#
# 프리픽스 충돌은 신경 쓸 필요 없다 — 매번 길이 내림차순으로 자동 정렬해
# 정규식을 만들므로 \으로가 항상 \로보다 먼저 매치된다. 단, 이 정렬은
# literal_macros + extra_macros 안에 **들어 있는** 토큰들 사이에서만
# 작동한다. 목록에 없는 긴 형태는 짧은 토큰에 먹힌다(아래 참고).
#
# \라 / \이라 가 기본값에 없는 이유: 이 조사는 홀로 끝나는 일이 드물고
# 거의 언제나 보조사가 뒤에 덧붙는다(\이라고, \이라는, \이라도, \이라서).
# 리터럴 목록은 정확히 그 문자열만 인식하므로 활용형을 감당할 수 없다.
# 주의: \라 는 \textbackslash{}라 로 눈에 띄게 깨지지만, \이라 는 \이 가
# 먼저 매치되고 라 가 평문으로 남아 **조용히 틀린다**(앞말이 모음으로
# 끝나면 이라 가 아니라 가라 로 조판된다).
#
# 권장 해법은 목록 등록이 아니라 원고에 종결자를 쓰는 것이다 — \이라{}고,
# \이라{}는 처럼 이름 끝에 빈 중괄호를 붙이면 목록에 없어도 통과한다(7장).
# 한글 음절이 letter인 조판 환경에서는 LaTeX 쪽에서도 어차피 필요한 표기다.
# 그래도 매번 타이핑하기 싫다면 아래 extra_macros에 등록해도 된다.
#
# 리스트형이라 전체 교체. 기본값을 유지한 채 **추가만** 하려면 아래
# extra_macros를 쓸 것.
literal_macros:
  - '\은'
  - '\는'
  - '\이'
  - '\가'
  - '\을'
  - '\를'
  - '\와'
  - '\과'
  - '\으로'
  - '\로'
  - '\<'


# ── 10. 추가 리터럴 토큰 (literal_macros 위에 덧붙임) ─────────────
# 기본 조사 매크로를 그대로 둔 채 프로젝트 전용 토큰만 보태는 확장 지점.
extra_macros: []

# 예시:
# extra_macros:
#   - '\>'
#   - '\|'
#   - '\에'
#   - '\에서'
#
# 라/이라 계열 활용형을 되살리고 싶다면 (순서는 자동 정렬되므로 무관):
# extra_macros: ['\이라고', '\라고', '\이라는', '\라는', '\이라', '\라']


# ── 11. showexam — 원문과 변환 결과를 나란히 (10.2) ───────────────
# 딕셔너리형이라 항목 단위 병합 — ratio 하나만 적어도 나머지는 유지된다.
#
# 펜스 줄에서 블록마다 덮어쓸 수도 있다:
#   ```showexam ratio=0.40 style=lstlisting align=c frame=none
showexam:
  ratio: 0.46        # 왼쪽(원문) 상자 폭. \linewidth 대비 비율
  gap: 0.04          # 두 상자 사이 여백. 오른쪽 폭 = 1 - ratio - gap
  align: t           # minipage 세로 정렬: t / c / b
  lang: markdown     # minted에 넘길 언어 태그

  # 원문 상자를 조판하는 방식. 실질적 선택 기준은 "긴 줄이 접히는가":
  #   minted     — 접힘. -shell-escape 필요, 느림
  #   lstlisting — 접힘. listings 패키지만 있으면 됨, 빠름
  #   verbatim   — 안 접힘(!). 추가 패키지가 필요 없는 대신 긴 줄이
  #                오른쪽 상자를 뚫고 페이지 여백까지 넘어간다
  style: minted

  # 원문 상자의 테두리. %(frame)s로 "frame=single," 같은 옵션 조각(쉼표
  # 포함)이 되어 아래 styles에 꽂히고, none이면 빈 문자열이 된다.
  # tcolorbox처럼 이미 테두리가 있는 template을 쓸 때는 반드시 none으로
  # 끌 것 — 안 그러면 상자 안에 상자가 겹친다.
  frame: single

  # 배치: side(좌우) / stack(위아래) / auto(가장 긴 줄이 stack_width칸을 넘으면 stack).
  # 블록마다 ```showexam layout=stack 으로 덮어쓸 수 있다. stack은 쪽을 넘어 이어지며
  # ratio/gap/align은 무시된다. sep은 원문과 결과 사이: rule / space / none / LaTeX 코드.
  layout: side
  stack_width: 36
  sep: rule

  # style 이름별 listing 템플릿. %(src)s 원문 / %(lang)s / %(frame)s.
  styles:
    minted: |-
      \begin{minted}[%(frame)sbreaklines,breakanywhere,fontsize=\small,xleftmargin=0pt]{%(lang)s}
      %(src)s
      \end{minted}
    lstlisting: |-
      \begin{lstlisting}[%(frame)sbreaklines=true,breakatwhitespace=false,basicstyle=\ttfamily\small,columns=fullflexible,aboveskip=0pt,belowskip=0pt,xleftmargin=0pt]
      %(src)s
      \end{lstlisting}
    # verbatim은 테두리를 그릴 수단이 없어 %(frame)s를 쓰지 않는다.
    verbatim: |-
      \begin{verbatim}
      %(src)s
      \end{verbatim}

  # 두 상자의 전체 배치.
  #   %(left)s  원문 상자 (verbatim/minted 등이 완성된 형태로 들어온다)
  #   %(right)s 변환 결과
  #   %(lw)s %(rw)s  왼쪽/오른쪽 폭 계수 ("0.4600" 같은 소수 문자열)
  #   %(ratio)s ratio 값 그대로 (tcolorbox의 lefthand ratio 등에)
  #   %(align)s t / c / b
  #   %(strut)s align=t일 때 \vspace{0pt}, 아니면 빈 문자열
  #
  # 경고: verbatim/minted는 매크로 "인자" 안에서 깨진다. 원문 상자를
  # \fbox{...}나 \parbox{...}로 감싸면 안 된다. minipage와 tcolorbox의
  # 본문은 인자가 아니라 환경 본문이라 안전하다.
  #
  # topsep/partopsep을 0으로 만드는 이유: verbatim과 minted는 내부적으로
  # trivlist라 상자 맨 위에 여분의 수직 여백을 얹는다. %(strut)s와 함께,
  # [t] 정렬 기준을 "첫 줄 베이스라인"에서 "상자 윗변"으로 옮겨준다.
  template: |-
    \par\medskip\noindent
    \begin{minipage}[%(align)s]{%(lw)s\linewidth}%(strut)s
    \setlength{\topsep}{0pt}\setlength{\partopsep}{0pt}
    %(left)s
    \end{minipage}\hfill
    \begin{minipage}[%(align)s]{%(rw)s\linewidth}%(strut)s
    \setlength{\topsep}{0pt}\setlength{\partopsep}{0pt}
    %(right)s
    \end{minipage}
    \par\medskip

# ── tcolorbox 버전 (프리앰블에 \usepackage[most]{tcolorbox} 필요) ──
# sidebyside와 breakable은 함께 쓸 수 없다. 둘 다 적으면 오류 없이
# 조용히 위/아래 2단으로 떨어지므로 알아채기 어렵다.
# showexam:
#   ratio: 0.42
#   frame: none
#   template: |-
#     \begin{tcolorbox}[sidebyside,sidebyside align=top,
#                       lefthand ratio=%(ratio)s]
#     %(left)s
#     \tcblower
#     %(right)s
#     \end{tcolorbox}


# ══════════════════════════════════════════════════════════════════
# 여기까지가 mapping.yaml로 설정할 수 있는 전부다.
#
# 아래 것들은 **front matter 전용**이라 이 파일에서는 지정할 수 없다:
#
#   class          문서 클래스 (기본 book)
#   classoptions   클래스 옵션 (classoption도 같은 뜻)
#   preamble       프리앰블에 그대로 삽입될 블록
#   title          제목
#   author         저자
#   date           날짜 (기본 \today)
#   toplevel       최상위 헤딩 레벨 — 위 headings를 덮어쓴다
#   mapping        이 파일의 경로
#   compileoption  --pdf 계열 옵션으로 컴파일할 때 넘길 인자
#   pandocoption   --pandoc 모드에서 pandoc에 넘길 인자 (1.1 참고).
#                  프리앰블·\documentclass 를 건드리는 옵션은 무시된다.
#   setup          다른 문서의 front matter를 상속받아 오기
#
# {{filename}} 파일 포함은 설정이 아니라 본문 문법이다(20장).
# ══════════════════════════════════════════════════════════════════

# ── 각주의 종류 ────────────────────────────────────────────────────
# 본문에서 ^[...]{A}, [^id]{B}, {A, opt=3}, {sym}, {sym=3} 꼴로 고른다.
# 기본 등록분(default, side, page, sidepar, sidebar, verb)에 더해진다.
# 템플릿: %(text)s = 본문, %(opt)s = 번호 지정 옵션([3] 또는 빈 문자열).
# \footnoteA 는 프리앰블에 \newfootnoteseries{A} 가 있어야 한다.
#notes:
#  A: '\footnoteA%(opt)s{%(text)s}'
#  B: '\footnoteB%(opt)s{%(text)s}'
#  default: '\footnoteA%(opt)s{%(text)s}'   # 꼬리표 없는 각주의 종류를 바꿈
